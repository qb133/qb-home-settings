# Modern tmux already picks sane defaults for default-terminal, escape-time
# and set-clipboard, so the usual "essential tmux fixes" are not needed here.

set -g mouse on
set -g focus-events on
set -g history-limit 50000

# vi copy mode, matching `set -o vi` in the shell.
setw -g mode-keys vi
set -g status-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on   # no gaps after closing a window

# Splits inherit the current pane's directory. `-` was delete-buffer.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# `r` was refresh-client.
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
