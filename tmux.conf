# Modern tmux already picks sane defaults for default-terminal, escape-time
# and set-clipboard, so the usual "essential tmux fixes" are not needed here.

set -g mouse on
set -g focus-events on
set -g history-limit 50000

# vi copy mode, matching `set -o vi` in the shell.
setw -g mode-keys vi
set -g status-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on   # no gaps after closing a window

# --- Aligned with herdr (workspace=session, tab=window, pane=pane) ----------
# herdr owns the scheme and tmux follows it, so muscle memory transfers both
# ways. The displaced tmux defaults are noted per block.

# Splits inherit the current pane's directory. `v` is side-by-side (mirrors
# vim's C-w v), `-` is stacked. `-` was delete-buffer, `v` was unbound.
unbind '"'
unbind %
unbind |
bind v split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Pane nav on hjkl, matching herdr and mode-keys vi. `l` was last-window.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Tab select-pane -t :.+
bind BTab select-pane -t :.-

# Shift marks the creative/destructive actions, as herdr does. This frees `r`
# for herdr's resize mode. Was: r refresh-client, & kill-window, , rename-window,
# $ rename-session.
unbind r
unbind &
unbind ,
unbind '$'
bind R source-file ~/.tmux.conf \; display "tmux.conf reloaded"
bind X kill-window
bind T command-prompt -I "#W" "rename-window '%%'"
bind W command-prompt -I "#S" "rename-session '%%'"
bind N new-session

# `w` is the picker, matching herdr's workspace picker (`w` was choose-window
# here, which picks the wrong level). herdr's `s` is Settings, so leave `s`
# unbound rather than keep training a picker reflex on it.
unbind s
bind w choose-tree -s

# `e` opens the scrollback in $EDITOR, matching herdr's edit_scrollback. This
# is the closest analogue herdr has to copy-mode; `prefix+[` stays tmux-only.
bind e capture-pane -S - \; save-buffer /tmp/tmux-scrollback \; delete-buffer \; new-window '${EDITOR:-vi} /tmp/tmux-scrollback'
