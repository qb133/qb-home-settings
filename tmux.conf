# tmux 3.6 already defaults default-terminal to tmux-256color, escape-time to 10
# and set-clipboard to external, so the usual "essential tmux fixes" for those
# are unnecessary here.

set -g mouse on
set -g focus-events on

# The default scrollback of 2000 lines is about two screens of build output.
set -g history-limit 50000

# vi keys in copy mode and at the command prompt. tmux only selects vi on its
# own when $EDITOR or $VISUAL contains "vi", so set it explicitly rather than
# depending on the environment.
setw -g mode-keys vi
set -g status-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Number windows and panes from 1 to match the number-key layout, and close
# them without leaving gaps.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Splits inherit the current pane's directory instead of starting in $HOME.
# The default % and " bindings still work.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Pick up changes after a `git pull` in this repo.
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
